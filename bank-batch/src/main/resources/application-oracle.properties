# ---------------------------------------------------------------------------
# Perfil 'oracle' - Oracle Autonomous Database (Oracle Cloud)
# ---------------------------------------------------------------------------
# Se activa con --spring.profiles.active=oracle
#
# IMPORTANTE: aqui NO va ninguna credencial. Este archivo se publica en GitHub.
# Los valores se toman de variables de entorno; si falta alguna, la aplicacion
# falla al arrancar con un mensaje claro en vez de conectarse a otra cosa.
#
# En PowerShell, antes de ejecutar:
#
#   $env:ORACLE_JDBC_URL = "jdbc:oracle:thin:@mibase_high?TNS_ADMIN=C:/oracle/wallet"
#   $env:ORACLE_USER     = "ADMIN"
#   $env:ORACLE_PASSWORD = "la-que-definiste-al-crear-la-base"
#
# El nombre del servicio (mibase_high) sale de tnsnames.ora dentro del wallet.
# Los sufijos _high, _medium y _low son niveles de prioridad de recursos;
# para un batch de este tamano cualquiera sirve, _low es el mas economico.
# ---------------------------------------------------------------------------

spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Autonomous Database corta las conexiones ociosas; conviene un pool chico y
# con validacion, porque un batch pasa ratos largos sin tocar la base.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.validation-timeout=10000
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# El dialecto de Oracle lo detecta Hibernate solo; no hay que declararlo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Spring Batch
# ---------------------------------------------------------------------------
# Crea las 6 tablas de metadata usando el script schema-oracle.sql que trae
# Spring Batch. Si ya existen, Spring Boot detecta y no lo vuelve a correr.
spring.batch.jdbc.initialize-schema=always

# Spring Batch crea la metadata del Job en aislamiento SERIALIZABLE por defecto.
# Oracle implementa ese nivel de forma optimista: ante el menor conflicto aborta
# con ORA-08177 ("no se puede serializar el acceso"). READ_COMMITTED es
# suficiente aqui, porque lo unico que protege es la creacion de la JobInstance.
spring.batch.jdbc.isolation-level-for-create=READ_COMMITTED
